<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiry - Techstacks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="styles.css">
<script src="scriptinquiry.js"></script>
<style>
:root{
--bg:#000;
--primary:#43f3d0;
--text:#ecfffb;
--light-grey:#d3d3d3;
--border-grey:rgba(211,211,211,0.3);
--muted:#9fbdb6;
}

body{
background-color:var(--bg);
color:var(--text);
font-family:'Inter',sans-serif;
margin:0;
padding:100px 20px 40px 20px;
}


/* Header fixed positioning should ignore body padding */
header { left: 0; right: 0; }
.nav-breadcrumb { position: relative; z-index: 2; }

.nav-breadcrumb{
display:flex;
align-items:center;
gap:12px;
max-width:1200px;
margin:10px auto 30px auto;
padding: 0;
}

.nav-breadcrumb a{
margin:0;
padding:0;
text-decoration:none;
display:flex;
align-items:center;
}

.nav-breadcrumb i.bi-house-door{
color:var(--muted);
font-size:1.15rem;
transition:0.3s;
}

.nav-breadcrumb i.bi-house-door:hover{
color:var(--muted);
}

.nav-breadcrumb i.bi-chevron-right{
color:rgba(159,189,182,0.45);
font-size:0.8rem;
}

.nav-breadcrumb .crumb-link{
color:var(--muted);
font-size:1.05rem;
font-weight:400;
transition:0.3s;
}

.nav-breadcrumb .crumb-link:hover{
color:var(--muted);
}

.nav-breadcrumb .active-page{
color:var(--muted);
font-weight:500;
font-size:1.05rem;
}

.inquiry-wrapper{
max-width:1200px;
width:100%;
display:grid;
grid-template-columns:1fr 1.2fr;
gap:50px;
margin:0 auto;
}

.preview-section{
display:flex;
flex-direction:column;
gap:20px;
}

.preview-section h2{
color:var(--primary);
font-size:1.8rem;
text-transform:uppercase;
letter-spacing:2px;
margin:0;
}

.template-card-style{
background:#000;
border:1px solid var(--light-grey);
border-radius:8px;
padding:20px;
width:100%;
box-sizing:border-box;
}

.image-box{
width:100%;
height:250px;
border-radius:6px;
overflow:hidden;
background:#111;
}

.image-box img{
width:100%;
height:100%;
object-fit:cover;
object-position:top;
}

.template-info{
margin-top:15px;
}

.template-info h3{
color:var(--primary);
margin:10px 0;
}

.features-list{
list-style:none;
padding:0;
margin:0;
display:flex;
flex-wrap:wrap;
gap:6px;
}

.features-list li{
border:1px solid var(--light-grey);
color:var(--light-grey);
padding:4px 10px;
border-radius:4px;
font-size:0.85rem;
}

.form-section{
background:#000;
border:1px solid var(--light-grey);
border-radius:8px;
padding:40px;
}

.form-section h2{
color:var(--primary);
font-size:1.8rem;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:30px;
margin-top:0;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
color:var(--light-grey);
font-size:0.85rem;
margin-bottom:8px;
text-transform:uppercase;
}

.input-group input,
.input-group textarea{
width:100%;
background:transparent!important;
border:1px solid var(--border-grey);
border-radius:4px;
padding:12px 15px;
color:#fff!important;
font-family:inherit;
font-size:1rem;
box-sizing:border-box;
outline:none;
}

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
textarea:-webkit-autofill,
textarea:-webkit-autofill:hover,
textarea:-webkit-autofill:focus{
-webkit-text-fill-color:#fff!important;
-webkit-box-shadow:0 0 0px 1000px #0a0a0a inset!important;
transition:background-color 5000s ease-in-out 0s;
}

.input-group input:focus,
.input-group textarea:focus{
border-color:var(--primary);
}

.type-toggle{
display:flex;
gap:10px;
}

.type-option{
flex:1;
user-select:none;
position:relative;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
padding:12px 14px;
border:1px solid var(--border-grey);
border-radius:6px;
color:var(--light-grey);
transition:0.25s;
cursor:pointer;
}

.type-option input{
position:absolute;
inset:0;
opacity:0;
}

.type-option span{
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;
font-size:0.85rem;
}

.type-option:has(input:checked){
border-color:var(--primary);
color:var(--primary);
box-shadow:0 0 0 1px rgba(67,243,208,0.15), 0 0 24px rgba(67,243,208,0.12);
}

.btn-submit{
width:100%;
padding:15px;
background:transparent;
border:1px solid var(--primary);
color:var(--primary);
font-weight:700;
text-transform:uppercase;
letter-spacing:2px;
cursor:pointer;
transition:0.4s;
border-radius:4px;
}

.btn-submit:hover{
background:var(--primary);
color:#000;
}

.btn-submit[disabled]{
opacity:0.65;
cursor:not-allowed;
}

/* success modal */
.modal{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
overflow:auto;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(6px);
}

.modal-content{
background:#050505;
margin:12vh auto;
padding:26px 24px;
border:1px solid rgba(211,211,211,0.25);
width:min(520px, calc(100% - 40px));
border-radius:14px;
box-shadow:0 0 0 1px rgba(67,243,208,0.08), 0 24px 80px rgba(0,0,0,0.65);
}

.modal-content h2{
margin:0 0 12px 0;
color:var(--primary);
letter-spacing:1px;
text-transform:uppercase;
font-size:1.2rem;
}

.modal-content p{
margin:0 0 18px 0;
color:var(--light-grey);
line-height:1.6;
}

.btn-ok{
width:100%;
height:48px;
border-radius:10px;
border:1px solid var(--primary);
background:transparent;
color:var(--primary);
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
cursor:pointer;
transition:0.25s;
}

.btn-ok:hover{
background:var(--primary);
color:#000;
}

@media(max-width:850px){
.inquiry-wrapper{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<header>
    <div class="nav">
        <div class="brand" onclick="window.location.href='/'">
            <img src="greenlogo.png" alt="Logo" class="brand-logo">
            <span>Techstacks</span>
        </div>
        <button class="menu-trigger" id="menuBtn" type="button">Menu</button>
        <nav id="navMenu">
            <a href="/#home" class="nav-link">Home</a>
            <a href="services.html" class="nav-link">Services</a>
            <div class="nav-item dropdown">
                <a href="#" class="nav-link">Products <i class="bi bi-chevron-down dropdown-arrow"></i></a>
                <div class="dropdown-content">
                    <a href="web-templates.html" class="dropdown-item">
                        <div class="dropdown-icon-box"><i class="bi bi-layout-text-window-reverse"></i></div>
                        <div class="dropdown-text">
                            <span class="dropdown-title">Web Templates</span>

                    <a href="led-wall.html" class="dropdown-item">

    </div>
</header>

<div id="successModal" class="modal">
  <div class="modal-content">
    <span id="closeModal" class="close" style="display:none;">&times;</span>
    <h2>Inquiry Submitted</h2>
    <p id="modalMessage"></p>
    <button id="okButton" class="btn-ok">OK</button>
  </div>
</div>

<nav class="nav-breadcrumb">
<a href="index.html"><i class="bi bi-house-door"></i></a>
<i class="bi bi-chevron-right"></i>
<a href="web-templates.html" class="crumb-link">Templates</a>
<i class="bi bi-chevron-right"></i>
<span class="active-page">Inquiry</span>
</nav>

<div class="inquiry-wrapper">

<div class="preview-section">

<h2>Template Details</h2>

<div class="template-card-style">

<div class="image-box">
<img id="templateDisplay" src="" alt="Selected template">
</div>

<div class="template-info">
<h3>Features</h3>
<ul id="featureList" class="features-list"></ul>
</div>

</div>

</div>

<div class="form-section">

<h2>Send Inquiry</h2>

<form id="inquiryForm" novalidate>

<div class="input-group">
<label>Full Name</label>
<input name="full_name" type="text" placeholder="Enter your name" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input name="email" type="email" placeholder="juandelacruz@gmail.com" required>
</div>
<div class="input-group">
<label>Message</label>
<textarea name="message" rows="5" placeholder="How can we help you?" required></textarea>
</div>

<input type="hidden" name="discovery_platform" value="other">
<input type="hidden" name="concern_type" value="template inquiry">
<input type="hidden" name="template_website" id="templateWebsiteInput" value="">
<input type="hidden" name="template_mobile" id="templateMobileInput" value="">

<button type="submit" class="btn-submit" id="submitBtn">Submit Inquiry</button>

</form>

</div>

</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const navMenu = document.getElementById('navMenu');
const navLinks = document.querySelectorAll('.nav-link');

if (menuBtn && navMenu) {
    menuBtn.addEventListener('click', () => {
        navMenu.classList.toggle('open');
        menuBtn.textContent = navMenu.classList.contains('open') ? 'Close' : 'Menu';
    });
}

navLinks.forEach((link) => {
    link.addEventListener('click', (e) => {
        const dropdownContainer = link.closest('.nav-item.dropdown');
        const isMobile = window.matchMedia('(max-width: 900px)').matches;

        if (dropdownContainer && isMobile) {
            e.preventDefault();
            dropdownContainer.classList.toggle('open');
            return;
        }

        if (navMenu && navMenu.classList.contains('open')) {
            navMenu.classList.remove('open');
            if (menuBtn) menuBtn.textContent = 'Menu';
        }
    });
});

// Dropdown hover delay (keeps menu open while moving cursor into it) - desktop only
const dropdown = document.querySelector('.nav-item.dropdown');
let dropdownCloseTimer;
function setupDropdownBehavior() {
    const isMobile = window.matchMedia('(max-width: 900px)').matches;
    if (dropdown && !isMobile) {
        dropdown.addEventListener('mouseenter', () => {
            clearTimeout(dropdownCloseTimer);
            dropdown.classList.add('open');
        });
        dropdown.addEventListener('mouseleave', () => {
            dropdownCloseTimer = setTimeout(() => dropdown.classList.remove('open'), 200);
        });
    }
}
setupDropdownBehavior();
window.addEventListener('resize', setupDropdownBehavior);

// Theme (dark/light/system)
const root = document.documentElement;
const themeBtns = document.querySelectorAll('.theme-btn');
const STORAGE_KEY = 'preferred-theme';

function resolveTheme(preferred) {
    if (preferred === 'system') {
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    return preferred === 'light' ? 'light' : 'dark';
}

function applyPreferredTheme(preferred, options = {}) {
    const theme = resolveTheme(preferred);
    root.setAttribute('data-theme', theme);

    themeBtns.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.theme === preferred);
    });

    if (options.persist !== false) {
        try { localStorage.setItem(STORAGE_KEY, preferred); } catch (e) {}
    }
}

let preferred = 'dark';
try { preferred = localStorage.getItem(STORAGE_KEY) || 'dark'; } catch (e) {}
applyPreferredTheme(preferred, { persist: false });

themeBtns.forEach((btn) => {
    btn.addEventListener('click', () => applyPreferredTheme(btn.dataset.theme));
});

if (window.matchMedia) {
    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => {
        let current = 'dark';
        try { current = localStorage.getItem(STORAGE_KEY) || 'dark'; } catch (e) {}
        if (current === 'system') applyPreferredTheme('system', { persist: false });
    };

    if (typeof mql.addEventListener === 'function') mql.addEventListener('change', onChange);
    else if (typeof mql.addListener === 'function') mql.addListener(onChange);
}


const templates=[
{img:"img/temp1.webp",features:["Home","About","Services","Contact"]},
{img:"img/temp2.webp",features:["Home","About","Services","Blog","Contact"]},
{img:"img/temp3.webp",features:["Home","About","Services","Contact"]},
{img:"img/temp4.webp",features:["Home","About","Services","Contact"]},
{img:"img/temp5.webp",features:["Home","About","Services","Features","Contact"]},
{img:"img/temp6.webp",features:["Home","About","Services","Contact"]},
{img:"img/temp7.webp",features:["Home","About","Services","Contact","Features"]},
{img:"img/temp8.webp",features:["Home","About","Services","Blog","Contact"]},
{img:"img/temp9.webp",features:["Home","About","Services","Contact"]},
{img:"img/temp10.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp11.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp12.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp13.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp14.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp15.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp16.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp17.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp18.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp19.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp20.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp21.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp22.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp23.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp24.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp25.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp26.webp",features:["Clean Code","Ad Optimized","Minimal"]},
{img:"img/temp27.webp",features:["Clean Code","Ad Optimized","Minimal"]}
];

function openSuccessModal(name, ref) {
  const modal = document.getElementById('successModal');
  const message = document.getElementById('modalMessage');
  const okBtn = document.getElementById('okButton');

  message.textContent = `Thank you, ${name}! Your inquiry was submitted successfully. Reference ID: ${ref}`;
  modal.style.display = 'block';

  okBtn.onclick = () => {
    modal.style.display = 'none';
    window.location.href = 'web-templates.html';
  };

  window.onclick = (event) => {
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  };
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const templateImg = params.get('template');

  if (templateImg) {
    document.getElementById('templateDisplay').src = templateImg;
    document.getElementById('templateWebsiteInput').value = templateImg;
    document.getElementById('templateMobileInput').value = templateImg;

    const template = templates.find(t => t.img === templateImg);
    const list = document.getElementById('featureList');
    list.innerHTML = '';
    if (template) {
      template.features.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f;
        list.appendChild(li);
      });
    }
  }

  const form = document.getElementById('inquiryForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());

    // Ensure defaults for template inquiries.
    payload.discovery_platform = 'other';
    payload.concern_type = 'template inquiry';

    if (!payload.template_website) {
      alert('Please select a template first.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    try {
      const res = await fetch('/api/inquiry', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload),
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to submit inquiry');
      }

      openSuccessModal(data.name, data.inquiry_id);
      form.reset();
      // restore template fields after reset
      if (templateImg) {
        document.getElementById('templateWebsiteInput').value = templateImg;
        document.getElementById('templateMobileInput').value = templateImg;
      }
    } catch (err) {
      alert(err.message || 'Something went wrong. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Inquiry';
    }
  });
});
</script>

</body>
</html>
